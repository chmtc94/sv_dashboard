name: Audit 17 hardening builder

on:
  push:
    branches:
      - audit-17-hardening

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-17-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Bundle pinned Lit locally
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sv-lit
          mkdir -p /tmp/sv-lit
          cd /tmp/sv-lit
          npm init -y >/dev/null
          npm install --ignore-scripts --no-save lit@3.3.1 esbuild@0.25.9 >/dev/null
          cat > lit-entry.js <<'EOF'
          export { LitElement, html, css, nothing } from "lit";
          EOF
          ./node_modules/.bin/esbuild lit-entry.js --bundle --format=esm --platform=browser --target=es2022 --minify --legal-comments=none --outfile="$GITHUB_WORKSPACE/custom_components/sv_dashboard/static/vendor-lit.js"

      - name: Apply audit hardening migration
        run: python3 -u tools/audit17_hardening.py

      - name: Canonicalize catalogs and final UI contracts
        run: python3 -u tools/audit17_postprocess.py

      - name: Align regression assertions with final contracts
        run: python3 -u tools/audit17_assertion_sync.py

      - name: Compile Python
        run: python3 -m py_compile custom_components/sv_dashboard/*.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in custom_components/sv_dashboard/static/*.js; do node --check "$file"; done

      - name: Run regression suite
        id: regressions
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > /tmp/audit17-tests.log 2>&1
          rc=$?
          cat /tmp/audit17-tests.log
          if [ "$rc" -ne 0 ]; then
            {
              echo 'Audit #17 failing regression names:'
              echo
              echo '```text'
              grep '^not ok' /tmp/audit17-tests.log || true
              echo
              echo 'Failure details:'
              awk '/^not ok/{show=1; n=0} show{print; n++} show && n>=22{show=0}' /tmp/audit17-tests.log
              echo '```'
            } > /tmp/audit17-comment.md
            gh issue comment 17 --repo "$GITHUB_REPOSITORY" --body-file /tmp/audit17-comment.md
          fi
          exit "$rc"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Materialize clean candidate from develop parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CaneTLOTW"
          git config user.email "35076818+CaneTLOTW@users.noreply.github.com"
          git fetch origin develop

          # Debug/build machinery belongs only to audit-17-hardening and must not
          # be present in the product candidate.
          git rm -f \
            .github/workflows/audit17-hardening.yml \
            tools/audit17_hardening.py \
            tools/audit17_postprocess.py \
            tools/audit17_assertion_sync.py

          # Keep the established Validate workflow byte-for-byte from develop.
          # The audit builder already syntax-checks every generated JS file; the
          # product candidate does not need a workflow-file mutation.
          git checkout origin/develop -- .github/workflows/validate.yaml
          git add -A

          parent="$(git rev-parse origin/develop)"
          if git diff --cached --quiet "$parent"; then
            echo "No candidate changes relative to develop" >&2
            exit 1
          fi

          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'feat: harden multi-powertrain runtime and frontend' | git commit-tree "$tree" -p "$parent")"
          git push origin "$commit:refs/heads/audit-17-candidate"
          echo "Candidate commit: $commit"
