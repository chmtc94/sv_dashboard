name: Audit 17 hardening builder

on:
  push:
    branches:
      - audit-17-hardening

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-17-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Bundle pinned Lit locally
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sv-lit
          mkdir -p /tmp/sv-lit
          cd /tmp/sv-lit
          npm init -y >/dev/null
          npm install --ignore-scripts --no-save lit@3.3.1 esbuild@0.25.9 >/dev/null
          cat > lit-entry.js <<'EOF'
          export { LitElement, html, css, nothing } from "lit";
          EOF
          ./node_modules/.bin/esbuild lit-entry.js --bundle --format=esm --platform=browser --target=es2022 --minify --legal-comments=none --outfile="$GITHUB_WORKSPACE/custom_components/sv_dashboard/static/vendor-lit.js"

      - name: Apply audit hardening migration
        run: python3 -u tools/audit17_hardening.py

      - name: Compile Python
        run: python3 -m py_compile custom_components/sv_dashboard/*.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in custom_components/sv_dashboard/static/*.js; do node --check "$file"; done

      - name: Run regression suite
        id: regressions
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > /tmp/audit17-tests.log 2>&1
          rc=$?
          cat /tmp/audit17-tests.log
          if [ "$rc" -ne 0 ]; then
            {
              echo 'Audit #17 failing regression names:'
              echo
              echo '```text'
              grep '^not ok' /tmp/audit17-tests.log || true
              echo
              echo 'Failure details:'
              awk '/^not ok/{show=1; n=0} show{print; n++} show && n>=16{show=0}' /tmp/audit17-tests.log
              echo '```'
            } > /tmp/audit17-comment.md
            gh issue comment 17 --repo "$GITHUB_REPOSITORY" --body-file /tmp/audit17-comment.md
          fi
          exit "$rc"
        env:
          GH_TOKEN: ${{ github.token }}
