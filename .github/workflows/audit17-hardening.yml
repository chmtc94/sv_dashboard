name: Audit 17 hardening builder

on:
  push:
    branches:
      - audit-17-hardening

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-17-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Bundle pinned Lit locally
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sv-lit
          mkdir -p /tmp/sv-lit
          cd /tmp/sv-lit
          npm init -y >/dev/null
          npm install --ignore-scripts --no-save lit@3.3.1 esbuild@0.25.9 >/dev/null
          cat > lit-entry.js <<'EOF'
          export { LitElement, html, css, nothing } from "lit";
          EOF
          ./node_modules/.bin/esbuild lit-entry.js --bundle --format=esm --platform=browser --target=es2022 --minify --legal-comments=none --outfile="$GITHUB_WORKSPACE/custom_components/sv_dashboard/static/vendor-lit.js"

      - name: Apply audit hardening migration
        run: python3 -u tools/audit17_hardening.py

      - name: Canonicalize catalogs and final UI contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          static = root / 'custom_components/sv_dashboard/static'
          tests = root / 'tests'

          # Fold the generated Hybrid/Fuel namespaces into the canonical frontend
          # catalog. The temporary split catalog must not survive the build.
          hybrid_path = static / 'i18n-hybrid-cards.js'
          hybrid = hybrid_path.read_text(encoding='utf-8')
          prefix = '/* Shared 18-language catalogs for Hybrid/Fuel-specific SV cards. */\nexport const HYBRID_CARD_TEXT = {\n'
          if not hybrid.startswith(prefix) or not hybrid.endswith('};\n'):
              raise RuntimeError('Unexpected generated Hybrid/Fuel catalog shape')
          namespaces = hybrid[len(prefix):-3]

          core_path = static / 'i18n-core.js'
          core = core_path.read_text(encoding='utf-8')
          marker = '  },\n};\n\nconst SUPPORTED_LANGUAGES'
          if marker not in core:
              raise RuntimeError('Could not locate canonical frontend catalog boundary')
          core = core.replace(marker, '  },\n' + namespaces + '};\n\nconst SUPPORTED_LANGUAGES', 1)
          core_path.write_text(core, encoding='utf-8')
          hybrid_path.unlink()

          i18n_path = static / 'i18n.js'
          i18n = i18n_path.read_text(encoding='utf-8')
          i18n = i18n.replace('import { HYBRID_CARD_TEXT } from "./i18n-hybrid-cards.js?v=0.6.0-beta.5";\n', '')
          i18n = i18n.replace('for (const [namespace, catalog] of Object.entries(HYBRID_CARD_TEXT)) {\n  FRONTEND_TEXT[namespace] = catalog;\n}\n\n', '')
          if 'i18n-hybrid-cards' in i18n or 'HYBRID_CARD_TEXT' in i18n:
              raise RuntimeError('Split Hybrid/Fuel catalog still referenced by i18n.js')
          i18n_path.write_text(i18n, encoding='utf-8')

          # Compact/shared hero: use live consumption, not accumulated trip energy,
          # and show both electric and fuel consumption on Hybrid vehicles.
          overview_path = static / 'vehicle-overview-card.js'
          overview = overview_path.read_text(encoding='utf-8')
          overview = overview.replace(
              '  const fuelAutonomy = mapped.fuel_autonomy;\n',
              '  const fuelAutonomy = mapped.fuel_autonomy;\n  const fuelConsumptionEntity = mapped.fuel_consumption_instant;\n',
              1,
          )
          overview = overview.replace(
              '    fuelAutonomy,\n    temperature,\n',
              '    fuelAutonomy,\n    fuelConsumptionEntity,\n    temperature,\n',
              1,
          )
          old_driving = '''            if (isDriving) {
              const energy = states[${literal(tripEnergy)}];
              if (energy && !['unknown','unavailable','none',''].includes(energy.state) && Number.isFinite(Number(energy.state))) {
                return ${literal(strings.driving)} + ' · ' + Number(energy.state).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' kWh';
              }
              return ${literal(strings.driving)};
            }
'''
          new_driving = '''            if (isDriving) {
              const values = [];
              const electric = states[${literal(tripConsumption)}];
              const fuelNow = states[${literal(fuelConsumptionEntity)}];
              if (electric && !['unknown','unavailable','none',''].includes(String(electric.state).toLowerCase()) && Number.isFinite(Number(electric.state))) {
                values.push(Number(electric.state).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' kWh/100 km');
              }
              if (fuelNow && !['unknown','unavailable','none',''].includes(String(fuelNow.state).toLowerCase()) && Number.isFinite(Number(fuelNow.state))) {
                values.push(Number(fuelNow.state).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' l/100 km');
              }
              return ${literal(strings.driving)} + (values.length ? ' · ' + values.join(' · ') : '');
            }
'''
          if old_driving not in overview:
              raise RuntimeError('Could not locate compact hero driving energy block')
          overview = overview.replace(old_driving, new_driving, 1)
          overview = overview.replace(
              'triggers_update: [primaryLevel, battery, batteryResidual, fuel, charging, engine, chargePower, tripEnergy].filter(Boolean),',
              'triggers_update: [primaryLevel, battery, batteryResidual, fuel, fuelConsumptionEntity, charging, engine, chargePower, tripEnergy, tripConsumption].filter(Boolean),',
              1,
          )
          overview_path.write_text(overview, encoding='utf-8')

          # The canonical i18n parity test can now read the new namespaces directly
          # from i18n-core.js; no special second-source branch remains.
          frontend_test = tests / 'frontend-i18n.test.mjs'
          text = frontend_test.read_text(encoding='utf-8')
          text = text.replace('import { HYBRID_CARD_TEXT } from "../custom_components/sv_dashboard/static/i18n-hybrid-cards.js";\n', '')
          text = text.replace(
              '''      const provided = HYBRID_CARD_TEXT[namespace]?.[language] || {
        ...(baseCatalogs[language]?.[namespace] || {}),
        ...(advancedCatalogs[language]?.[namespace] || {}),
      };
''',
              '''      const provided = {
        ...(baseCatalogs[language]?.[namespace] || {}),
        ...(advancedCatalogs[language]?.[namespace] || {}),
      };
''',
          )
          frontend_test.write_text(text, encoding='utf-8')

          hybrid_test = tests / 'hybrid-fuel-ui.test.mjs'
          text = hybrid_test.read_text(encoding='utf-8')
          text = text.replace(
              'import { HYBRID_CARD_TEXT } from "../custom_components/sv_dashboard/static/i18n-hybrid-cards.js";\n',
              'import { FRONTEND_TEXT as CORE_FRONTEND_TEXT } from "../custom_components/sv_dashboard/static/i18n-core.js";\n',
          )
          text = text.replace('HYBRID_CARD_TEXT.dualEnergyOverview', 'CORE_FRONTEND_TEXT.dualEnergyOverview')
          text = text.replace('HYBRID_CARD_TEXT.fuelHistory', 'CORE_FRONTEND_TEXT.fuelHistory')
          hybrid_test.write_text(text, encoding='utf-8')

          # Synchronize regex literals that escaped the normal beta.4 -> beta.5
          # source replacement, plus the one implementation-class expectation.
          for path in tests.glob('*.mjs'):
              text = path.read_text(encoding='utf-8')
              text = text.replace(r'0\.6\.0-beta\.4', r'0\.6\.0-beta\.5')
              text = text.replace('Ec3ServerTripHistorySensor', 'SvServerTripHistorySensor')
              path.write_text(text, encoding='utf-8')

          # Validation/docs must describe/check the final canonical layout.
          validate_path = root / '.github/workflows/validate.yaml'
          validate = validate_path.read_text(encoding='utf-8')
          validate = validate.replace('          node --check custom_components/sv_dashboard/static/i18n-hybrid-cards.js\n', '')
          validate_path.write_text(validate, encoding='utf-8')

          loc_path = root / 'docs/LOCALISATION.en.md'
          loc = loc_path.read_text(encoding='utf-8')
          loc = loc.replace(
              'Hybrid/fuel-specific custom-card strings are part of the shared frontend catalog in `static/i18n-hybrid-cards.js` and are composed through `static/i18n.js`.',
              'Hybrid/fuel-specific custom-card strings are namespaces of the canonical frontend catalog in `static/i18n-core.js` and are consumed through `static/i18n.js`.',
          )
          loc_path.write_text(loc, encoding='utf-8')

          audit_path = tests / 'audit17-hardening.test.mjs'
          audit = audit_path.read_text(encoding='utf-8')
          audit += '''\n\ntest("Hybrid/Fuel strings have one canonical frontend source", () => {
  const files = fs.readdirSync(staticDir);
  assert.ok(!files.includes("i18n-hybrid-cards.js"));
  const core = read("static/i18n-core.js");
  assert.match(core, /dualEnergyOverview:/);
  assert.match(core, /fuelHistory:/);
  assert.doesNotMatch(read("static/dual-energy-overview-card.js"), /const TEXT =/);
  assert.doesNotMatch(read("static/fuel-history-card.js"), /const TEXT =/);
});\n'''
          audit_path.write_text(audit, encoding='utf-8')

          # Final source contract: no deleted catalog reference can remain.
          for path in [*static.glob('*.js'), *tests.glob('*.mjs'), validate_path, loc_path]:
              if 'i18n-hybrid-cards.js' in path.read_text(encoding='utf-8'):
                  raise RuntimeError(f'split catalog reference remains in {path}')
          PY

      - name: Compile Python
        run: python3 -m py_compile custom_components/sv_dashboard/*.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in custom_components/sv_dashboard/static/*.js; do node --check "$file"; done

      - name: Run regression suite
        id: regressions
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > /tmp/audit17-tests.log 2>&1
          rc=$?
          cat /tmp/audit17-tests.log
          if [ "$rc" -ne 0 ]; then
            {
              echo 'Audit #17 failing regression names:'
              echo
              echo '```text'
              grep '^not ok' /tmp/audit17-tests.log || true
              echo
              echo 'Failure details:'
              awk '/^not ok/{show=1; n=0} show{print; n++} show && n>=20{show=0}' /tmp/audit17-tests.log
              echo '```'
            } > /tmp/audit17-comment.md
            gh issue comment 17 --repo "$GITHUB_REPOSITORY" --body-file /tmp/audit17-comment.md
          fi
          exit "$rc"
        env:
          GH_TOKEN: ${{ github.token }}